<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOUR COMPANY NAME | What you do in a few words</title>
  <meta name="description" content="One sentence describing what YOUR COMPANY NAME does and who it helps.">
  <style>
    :root {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --text: #18232b;
      --muted: #52616b;
      --accent: #0f6b6b;
      --line: #d9e0e5;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }
    a { color: var(--accent); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 1.25rem; }

    header { background: var(--surface); border-bottom: 1px solid var(--line); }
    header .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; padding-top: 1rem; padding-bottom: 1rem; }
    .brand { font-family: Georgia, serif; font-size: 1.35rem; font-weight: 700; color: var(--text); text-decoration: none; }
    nav { display: flex; gap: 1.25rem; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--accent); text-decoration: underline; }

    .hero { padding: 4.5rem 0 3.5rem; }
    h1 { font-family: Georgia, serif; font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.15; margin: 0 0 1rem; max-width: 18ch; }
    .hero p { font-size: 1.15rem; color: var(--muted); max-width: 52ch; margin: 0 0 1.75rem; }
    .button { display: inline-block; background: var(--accent); color: #fff; padding: 0.8rem 1.4rem; border-radius: 6px; text-decoration: none; font-weight: 600; }
    .button:hover { background: #0b5555; }
    .button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }

    section { padding: 3rem 0; border-top: 1px solid var(--line); }
    h2 { font-family: Georgia, serif; font-size: 1.75rem; margin: 0 0 1rem; }
    section p { max-width: 62ch; margin: 0 0 1rem; }

    .services { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 1.5rem; }
    .service { background: var(--surface); border-left: 4px solid var(--accent); padding: 1rem 1.25rem; }
    .service h3 { margin: 0 0 0.4rem; font-size: 1.1rem; }
    .service p { margin: 0; color: var(--muted); }

    .contact-list { list-style: none; padding: 0; margin: 1.25rem 0 0; }
    .contact-list li { margin-bottom: 0.5rem; }

    footer { border-top: 1px solid var(--line); padding: 1.5rem 0; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <div class="wrap">
      <a class="brand" href="#top">YOUR COMPANY NAME</a>
      <nav aria-label="Main">
        <a href="#about">About</a>
        <a href="#services">Services</a>
